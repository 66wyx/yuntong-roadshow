name: Handheld CI

on:
  push:
    branches: [handheld]
  pull_request:
    branches: [handheld]

permissions:
  contents: read

concurrency:
  group: handheld-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Handheld checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify LFS pointers
        run: git lfs fsck --pointers HEAD
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Test backend and RID host code
        run: |
          python -m pip install -e '.[dev]' Pillow
          python -m pytest
          python hardware/rid-handheld-evt1/firmware/p4-prototype/test_rid_validation.py
          python hardware/rid-handheld-evt1/firmware/p4/tools/host_check.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Test roadshow package
        run: npm test
      - name: Test and build AIRSPACE frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
